version: '3.8'

services:
  mysql:
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/mysql:8.0
    container_name: mysql
    restart: unless-stopped
    command: --performance_schema=OFF --innodb_buffer_pool_size=80M --innodb_log_buffer_size=8M --max_connections=25 --table_open_cache=32 --thread_cache_size=4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: slowloris
    volumes:
      - ./data/mysql:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/01-init.sql
      - ./nacos-init.sql:/docker-entrypoint-initdb.d/02-nacos.sql
    networks:
      - micro-net
    deploy:
      resources:
        limits:
          memory: 256m
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/redis:7-alpine
    container_name: redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 64mb --maxmemory-policy allkeys-lru --save ""
    volumes:
      - ./data/redis:/data
    networks:
      - micro-net
    deploy:
      resources:
        limits:
          memory: 96m

  nacos:
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/nacos/nacos-server:v2.3.0
    container_name: nacos
    restart: unless-stopped
    environment:
      MODE: standalone
      SPRING_DATASOURCE_PLATFORM: mysql
      MYSQL_SERVICE_HOST: mysql
      MYSQL_SERVICE_DB_NAME: nacos
      MYSQL_SERVICE_USER: root
      MYSQL_SERVICE_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_SERVICE_PORT: 3306
      NACOS_AUTH_ENABLE: "true"
      NACOS_AUTH_TOKEN: ${NACOS_AUTH_TOKEN:-change-me-to-a-random-base64-string}
      NACOS_AUTH_IDENTITY_KEY: ${NACOS_AUTH_IDENTITY_KEY:-serverIdentity}
      NACOS_AUTH_IDENTITY_VALUE: ${NACOS_AUTH_IDENTITY_VALUE:-security}
      JVM_XMS: 64m
      JVM_XMX: 128m
      JVM_XMN: 24m
      JVM_MS: 16m
      JVM_MMS: 32m
    ports:
      - "127.0.0.1:8848:8848"
      - "127.0.0.1:9848:9848"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - micro-net
    deploy:
      resources:
        limits:
          memory: 220m

  gateway-service:
    build: ./gateway-service
    container_name: gateway-service
    restart: unless-stopped
    ports:
      - "8090:8080"
    environment:
      SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR: nacos:8848
      SPRING_CLOUD_NACOS_CONFIG_SERVER_ADDR: nacos:8848
      JAVA_OPTS: "-Xms32m -Xmx80m -XX:+UseSerialGC -XX:MaxMetaspaceSize=56m -XX:ReservedCodeCacheSize=32m"
    depends_on:
      - nacos
    networks:
      - micro-net
    deploy:
      resources:
        limits:
          memory: 200m

  auth-service:
    build: ./auth-service
    container_name: auth-service
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/slowloris?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD}
      SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR: nacos:8848
      SPRING_CLOUD_NACOS_CONFIG_SERVER_ADDR: nacos:8848
      WECHAT_APP_ID: ${WECHAT_APP_ID:-wx_placeholder}
      WECHAT_APP_SECRET: ${WECHAT_APP_SECRET:-placeholder}
      WECHAT_CALLBACK_URL: ${WECHAT_CALLBACK_URL:-http://your-server-ip:8090/api/wechat/callback}
      JAVA_OPTS: "-Xms32m -Xmx80m -XX:+UseSerialGC -XX:MaxMetaspaceSize=56m -XX:ReservedCodeCacheSize=32m"
    depends_on:
      mysql:
        condition: service_healthy
      nacos:
        condition: service_started
    networks:
      - micro-net
    deploy:
      resources:
        limits:
          memory: 200m

  monitor-service:
    build: ./monitor-service
    container_name: monitor-service
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/slowloris?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD}
      SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR: nacos:8848
      SPRING_CLOUD_NACOS_CONFIG_SERVER_ADDR: nacos:8848
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      AGENT_REPORT_URL: ${AGENT_REPORT_URL:-http://your-server-ip:8090}
      JAVA_OPTS: "-Xms32m -Xmx80m -XX:+UseSerialGC -XX:MaxMetaspaceSize=56m -XX:ReservedCodeCacheSize=32m"
    depends_on:
      mysql:
        condition: service_healthy
      nacos:
        condition: service_started
    networks:
      - micro-net
    deploy:
      resources:
        limits:
          memory: 200m

  alert-log-service:
    build: ./alert-log-service
    container_name: alert-log-service
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/slowloris?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD}
      SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR: nacos:8848
      SPRING_CLOUD_NACOS_CONFIG_SERVER_ADDR: nacos:8848
      JAVA_OPTS: "-Xms32m -Xmx80m -XX:+UseSerialGC -XX:MaxMetaspaceSize=56m -XX:ReservedCodeCacheSize=32m"
    depends_on:
      mysql:
        condition: service_healthy
      nacos:
        condition: service_started
    networks:
      - micro-net
    deploy:
      resources:
        limits:
          memory: 200m

  frontend:
    build: ../frontend
    container_name: frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - gateway-service
    networks:
      - micro-net
    deploy:
      resources:
        limits:
          memory: 48m

networks:
  micro-net:
    driver: bridge
