server:
  port: 8080

spring:
  application:
    name: gateway-service
  config:
    import:
      - optional:nacos:gateway-service.yml
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
        username: nacos
        password: ${NACOS_PASSWORD:nacos}
      config:
        server-addr: localhost:8848
        username: nacos
        password: ${NACOS_PASSWORD:nacos}
        file-extension: yml
    gateway:
      routes:
        # Auth 公开接口（无需 JWT）
        - id: auth-public
          uri: lb://auth-service
          predicates:
            - Path=/api/login, /api/register, /api/verify, /api/health,/api/users, /api/users/**
          filters:
            - RewritePath=/api/(?<segment>.*), /${segment}

        # 微信 OAuth（无需 JWT）
        - id: wechat-auth
          uri: lb://auth-service
          predicates:
            - Path=/api/wechat/**, /wechat/**
          filters:
            - RewritePath=/api/wechat/(?<segment>.*), /wechat/${segment}

        # 个人资料（需要 JWT，转发 Authorization 头由 auth-service 自行解析用户）
        - id: auth-profile
          uri: lb://auth-service
          predicates:
            - Path=/api/profile, /api/profile/**
          filters:
            - RewritePath=/api/(?<segment>.*), /${segment}
            - JwtFilter

        # Monitor SSE 长连接专用路由（必须在通配路由之前）——禁用响应超时，避免网关强制断流
        - id: monitor-stream-sse
          uri: lb://monitor-service
          predicates:
            - Path=/api/monitor/stream
          filters:
            - RewritePath=/api/monitor/(?<segment>.*), /monitor/${segment}
            - JwtFilter
          metadata:
            response-timeout: -1
            connect-timeout: 10000

        # Monitor Service（需要 JWT）
        - id: monitor-service
          uri: lb://monitor-service
          predicates:
            - Path=/api/monitor/**
          filters:
            - RewritePath=/api/monitor/(?<segment>.*), /monitor/${segment}
            - JwtFilter

        # 主机探针(Agent)上报与脚本下载（无需 JWT，改用 per-target token 鉴权）
        # 必须放在通配的 alert-log-internal(/internal/**) 之前，避免被其吃掉路由。
        - id: monitor-agent-internal
          uri: lb://monitor-service
          predicates:
            - Path=/internal/agent/**
          filters:
            - StripPrefix=0

        # Alert-Log Service 用户端（需要 JWT）
        - id: alert-log-user
          uri: lb://alert-log-service
          predicates:
            - Path=/api/alerts/**, /api/alerts, /api/logs/**, /api/logs
          filters:
            - RewritePath=/api/(?<segment>.*), /${segment}
            - JwtFilter

        # Alert-Log Service 内部接口（monitor-service Feign 调用，无需 JWT）
        - id: alert-log-internal
          uri: lb://alert-log-service
          predicates:
            - Path=/internal/**
          filters:
            - StripPrefix=0

# JWT（与 auth-service 保持一致，生产环境通过环境变量注入）
jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000

management:
  endpoints:
    web:
      exposure:
        include: health,info,routes
  endpoint:
    health:
      show-details: always

logging:
  level:
    # 浏览器正常关闭 SSE 连接时 Reactor Netty 会抛 PrematureCloseException，属正常现象，降级为 WARN
    org.springframework.web.server.adapter.HttpWebHandlerAdapter: WARN
    reactor.netty.http.server.HttpServerOperations: WARN
