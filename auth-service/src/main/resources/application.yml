server:
  port: 8081

spring:
  application:
    name: auth-service
  config:
    import:
      - optional:nacos:auth-service.yml
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
        username: nacos
        password: nacos
      config:
        server-addr: localhost:8848
        username: nacos
        password: nacos
        file-extension: yml
  datasource:
    url: jdbc:mysql://localhost:3305/slowloris?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: Root@123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: localhost
      port: 6378
      password: default
      database: 0

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.slowloris.auth.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# JWT Configuration（生产环境通过环境变量 JWT_SECRET 注入）
jwt:
  secret: ${JWT_SECRET:change-me-to-a-random-64-char-string-for-hs512-algorithm}
  expiration: 3600000 # 1 hour in milliseconds
  refresh-expiration: 86400000 # 24 hours in milliseconds

# 微信开放平台配置（通过环境变量注入，个人号无权限请启用 mock 模式）
wechat:
  app-id: ${WECHAT_APP_ID:your_app_id}
  app-secret: ${WECHAT_APP_SECRET:your_app_secret}
  callback-url: ${WECHAT_CALLBACK_URL:http://localhost:8080/api/wechat/callback}
  # 个人号无法获得 snsapi_login 扫码登录权限，开启 mock 走本地模拟回调，便于演示。
  # 生产环境（企业网站应用 appid）请设为 false 走真实微信授权。
  mock-enabled: ${WECHAT_MOCK_ENABLED:true}

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
