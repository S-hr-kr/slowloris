server:
  port: 8082

spring:
  application:
    name: monitor-service
  config:
    import:
      - optional:nacos:monitor-service.yml
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
        username: nacos
        password: ${NACOS_PASSWORD:nacos}
      config:
        server-addr: localhost:8848
        username: nacos
        password: ${NACOS_PASSWORD:nacos}
        file-extension: yml
  datasource:
    url: jdbc:mysql://localhost:3305/slowloris?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: localhost
      port: 6378
      password: ${REDIS_PASSWORD}
      database: 0
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.slowloris.monitor.entity
  configuration:
    map-underscore-to-camel-case: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

deepseek:
  api:
    key: ${DEEPSEEK_API_KEY:}
    url: https://api.deepseek.com/v1/chat/completions
    model:
      name: deepseek-chat
    temperature: 0.1

# SNMP 采集配置 —— 采集目标网络设备的流量/连接数等指标
snmp:
  enabled: true                      # 开启 SNMP 采集，直接向靶机拉 TCP 连接状态
  timeout: 2000                      # SNMP 请求超时（毫秒）
  retries: 1                         # 重试次数
  community: public                  # SNMP v2c community 只读串（需与靶机 snmpd 一致）
  targets:                           # 按目标 IP 映射 SNMP 设备，示例：
    # - target-ip: your-server-ip
    #   device: your-server-ip
    #   port: 161

# 主机探针(Agent)配置
agent:
  # 探针上报地址（公网 gateway 基址）。安装命令会把它拼进 curl 上报 URL，
  # 用户在自己服务器上装的探针据此回连平台。生产环境务必用 HTTPS 域名。
  report-url: ${AGENT_REPORT_URL:http://localhost:8080}
